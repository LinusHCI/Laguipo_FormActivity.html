<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form</title>
</head>
<body style="background-color: blanchedalmond;text-align: center;">
<h1>HTML Form</h1>
<form action="#" method="post">
<fieldset>
<legend><h2>Personal Information</h2></legend>
<label id="name">Name:</label><br>
<input type="text" id="name"><br>
<label id="email">Email:</label><br>
<input type="email" id="email"><br>
</fieldset>
<fieldset>
    <label id="gender">Gender:</label>
    <br>
    <input type="radio" id="male">
    <label for="male">Male</label>
    <br>
    <input type="radio" id="female">
    <label for="female">Female</label>
    <br>
    <input type="radio" id="other">
    <label for="other">Other</label>
</fieldset>
<fieldset>
    <label id="hobbies">Hobbies:</label>
    <br>
    <input type="checkbox" id="gaming" name="hobbies" value="gaming">
    <label for="gaming">Gaming</label>
    <br>
    <input type="checkbox" id="indoors" name="hobbies" value="Indoors">
    <label for="indoors">Reading</label>
    <br>
    <input type="checkbox" id="instruments" name="Hobbies" value="Instruments">
    <label for="instruments">Playing the Guitar</label>
</fieldset>
<fieldset>
    <p>Feedback/Additional Comments:</p>

    <label for="comment">Put comments here:</label>
    <input type="text" name="comments" id="comment">
</fieldset>
<fieldset>
<input type="submit" value="Submit">
</fieldset>
</form>
</body>
</html>
